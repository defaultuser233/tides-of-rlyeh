name: Release

# Manual only, on purpose: a release is a decision, not a side effect of a push.
# The version is whatever `Cargo.toml` says, so a release is always made from a
# commit whose version was bumped on purpose; the tag is `v<that version>`.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

# Two releases at once would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the libraries the build links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  windows:
    name: Windows x86_64
    needs: gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      # The gates job tests on Linux; this is the platform the game is played
      # on, and `win32.rs` only compiles here, so the same suite runs here too.
      - name: cargo test
        run: cargo test

      # `.cargo/config.toml` turns on `+crt-static` for this target, which is
      # what keeps the executable free of the Visual C++ redistributable.
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/tides-of-rlyeh.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath tides-of-rlyeh-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tides-of-rlyeh-windows-x86_64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is the native build, so it has sound: the binary links against the
      # system glibc, libX11 and libGL, which every desktop distribution has.
      # The silent musl build is `build-linux.ps1`'s job, not a release's.
      - name: Install the libraries the build links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/tides-of-rlyeh dist/
          cp LICENSE dist/
          tar -czf tides-of-rlyeh-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tides-of-rlyeh-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      # A checkout, because the version comes from the commit being released
      # rather than from an input someone can mistype.
      - uses: actions/checkout@v4

      - name: Read the version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::no version line in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::release from main, not from $GITHUB_REF_NAME"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists; bump Cargo.toml or delete the tag first"
            exit 1
          fi

          args=(--title "TIDES OF R'LYEH $TAG" --target "$GITHUB_SHA" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" dist/* "${args[@]}"

          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
